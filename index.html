<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - AI Chatbot</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>

<body>

  <div
    class="drawer-backdrop"
    id="drawerBackdrop"
    aria-hidden="true">
  </div>

  <aside
    class="sidebar"
    id="sidebar"
    aria-label="Recent chats">

    <div class="logo-area">

      <div>
        <div class="logo">✦</div>
        <h2>Nova AI</h2>
      </div>

      <button
        class="drawer-close"
        id="drawerClose"
        type="button"
        aria-label="Close recent chats">
        Smart
      </button>

    </div>

    <button
      class="new-chat"
      type="button"
      onclick="newChat()">
      ＋ New chat
    </button>

    <div class="history-title">
      Recent chats
    </div>

    <div
      class="history"
      id="history">
    </div>

    <div class="sidebar-bottom">

      <button
        type="button"
        onclick="toggleTheme()"
        id="themeButton">
        🌙 Dark mode
      </button>

      <button type="button">
        ⚙ Settings
      </button>

      <button type="button">
        ♡ Help & Feedback
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="model">

        <button
          class="icon-btn mobile-menu"
          id="mobileMenuButton"
          type="button"
          aria-label="Open recent chats"
          aria-expanded="false">
          ☰
        </button>

        Nova AI

        <span class="badge">
          Smart
        </span>

      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          type="button"
          onclick="toggleTheme()"
          id="themeIcon"
          title="Toggle theme"
          aria-label="Toggle theme">
          🌙
        </button>

        <button class="icon-btn" type="button">☰</button>

        <button class="icon-btn" type="button">•••</button>

      </div>

    </header>

    <section
      class="chat"
      id="chat">

      <div
        class="chat-container"
        id="messages"
        aria-live="polite">

        <div
          class="welcome"
          id="welcome">

          <div class="orb">
            ✦
          </div>

          <h1>
            How can I help you
            <span class="gradient">
              today?
            </span>
          </h1>

          <p>
            Ask questions, brainstorm ideas, write code, learn new things,
            or build something amazing.
          </p>

          <div class="suggestions" id="suggestions">

            <button
              class="suggestion"
              type="button"
              onclick="useSuggestion('Create a modern portfolio website')">

              <strong>✦ Create something</strong>
              <span>Build a beautiful portfolio website</span>

            </button>

            <button
              class="suggestion"
              type="button"
              onclick="useSuggestion('Explain artificial intelligence simply')">

              <strong>◎ Learn something</strong>
              <span>Understand a complex topic easily</span>

            </button>

            <button
              class="suggestion"
              type="button"
              onclick="useSuggestion('Give me 10 startup ideas')">

              <strong>◈ Brainstorm</strong>
              <span>Generate creative project ideas</span>

            </button>

            <button
              class="suggestion"
              type="button"
              onclick="useSuggestion('Write a JavaScript function to sort an array')">

              <strong>⌘ Code</strong>
              <span>Get help with programming</span>

            </button>

          </div>

        </div>

      </div>

    </section>

    <div class="composer-area">

      <form
        class="composer"
        id="chatForm">

        <div class="input-box">

          <button
            type="button"
            class="attach-btn"
            aria-label="Attach file">
            ＋
          </button>

          <textarea
            id="input"
            rows="1"
            placeholder="Message Nova AI..."
            aria-label="Message Nova AI"></textarea>

          <button
            type="submit"
            class="send-btn"
            id="sendBtn"
            disabled
            title="Send message"
            aria-label="Send message">
            ↑
          </button>

        </div>

        <div class="hint">
          Nova AI can make mistakes.
          Check important information.
        </div>

      </form>

    </div>

  </main>

  <script src="config.js"></script>
  <script defer src="vendor/katex/katex.min.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>

</body>
</html>
