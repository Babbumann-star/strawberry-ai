<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - AI Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #080b12; --sidebar: #0d111a; --card: #121826; --card-hover: #192133; --text: #f5f7fb; --muted: #8d96a8; --border: rgba(255,255,255,0.08); --user: #252d3d; --input: rgba(17,22,34,.92); --button: #252e40; --shadow: rgba(0,0,0,.4); }
    body.light { --bg: #f5f7fb; --sidebar: #ffffff; --card: #ffffff; --card-hover: #f0f2f7; --text: #151923; --muted: #687184; --border: rgba(0,0,0,0.09); --user: #e9ecf3; --input: rgba(255,255,255,.96); --button: #edf0f5; --shadow: rgba(0,0,0,.12); }
    body { font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: background .3s ease, color .3s ease; }
    button, textarea { font-family: inherit; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 270px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; z-index: 10; transition: background .3s ease, border .3s ease; }
    .logo-area { display: flex; align-items: center; gap: 10px; padding: 5px 8px 20px; }
    .logo { width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; background: linear-gradient(135deg, #7c5cff, #28c8ff); color: white; box-shadow: 0 10px 30px rgba(124,92,255,.3); }
    .logo-area h2 { font-size: 17px; }
    .new-chat { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 12px; border-radius: 12px; cursor: pointer; text-align: left; transition: .2s; }
    .new-chat:hover { background: var(--card-hover); transform: translateY(-1px); }
    .history-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 25px 8px 10px; }
    .history { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
    .history button { border: none; background: transparent; color: var(--text); padding: 11px; border-radius: 9px; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history button:hover { background: var(--card-hover); }
    .sidebar-bottom { margin-top: auto; }
    .sidebar-bottom button { width: 100%; border: none; background: transparent; color: var(--muted); padding: 11px; text-align: left; border-radius: 9px; cursor: pointer; }
    .sidebar-bottom button:hover { background: var(--card-hover); color: var(--text); }
    .main { margin-left: 270px; height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 65px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; background: var(--bg); transition: background .3s ease, border .3s ease; }
    .model { font-weight: bold; display: flex; align-items: center; gap: 9px; }
    .badge { font-size: 10px; color: #7c5cff; background: rgba(124,92,255,.12); border: 1px solid rgba(124,92,255,.2); padding: 5px 9px; border-radius: 50px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; color: var(--text); cursor: pointer; transition: .2s; }
    .icon-btn:hover { background: var(--card-hover); transform: translateY(-1px); }
    .chat { flex: 1; overflow-y: auto; }
    .chat-container { width: min(900px, 92%); margin: auto; padding: 60px 0 170px; }
    .welcome { text-align: center; padding-top: 7vh; }
    .orb { width: 75px; height: 75px; margin: auto; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; border-radius: 25px; font-size: 32px; color: white; background: linear-gradient(135deg, #7c5cff, #28c8ff); box-shadow: 0 20px 60px rgba(75,100,255,.3); animation: floating 4s ease-in-out infinite; }
    @keyframes floating { 50% { transform: translateY(-8px) rotate(2deg); } }
    .welcome h1 { font-size: clamp(32px, 5vw, 52px); letter-spacing: -2px; margin-bottom: 12px; }
    .gradient { background: linear-gradient(90deg, #7c5cff, #28c8ff); -webkit-background-clip: text; color: transparent; }
    .welcome p { color: var(--muted); max-width: 600px; margin: auto; line-height: 1.7; }
    .suggestions { max-width: 750px; margin: 30px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .suggestion { text-align: left; padding: 17px; border-radius: 15px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; transition: .2s; }
    .suggestion:hover { background: var(--card-hover); border-color: rgba(124,92,255,.4); transform: translateY(-2px); }
    .suggestion strong { display: block; margin-bottom: 6px; }
    .suggestion span { color: var(--muted); font-size: 13px; }
    .message { display: flex; gap: 13px; margin: 28px 0; animation: messageIn .25s ease; }
    @keyframes messageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { width: 35px; height: 35px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .ai-avatar { background: linear-gradient(135deg, #7c5cff, #28c8ff); color: white; }
    .user-avatar { background: #293348; color: white; }
    .bubble { max-width: 760px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
    .user-message { justify-content: flex-end; }
    .user-message .avatar { order: 2; }
    .user-bubble { background: var(--user); border: 1px solid var(--border); padding: 11px 15px; border-radius: 17px; }
    .typing { display: flex; gap: 5px; padding: 10px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: typing 1s infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes typing { 50% { opacity: .25; transform: translateY(-4px); } }
    .composer-area { position: fixed; bottom: 0; left: 270px; right: 0; padding: 20px; background: linear-gradient(transparent, var(--bg) 35%); }
    .composer { width: min(900px, 100%); margin: auto; }
    .input-box { display: flex; align-items: flex-end; gap: 9px; padding: 10px; border: 1px solid var(--border); background: var(--input); border-radius: 20px; box-shadow: 0 25px 70px var(--shadow); backdrop-filter: blur(20px); }
    textarea { flex: 1; resize: none; min-height: 42px; max-height: 150px; border: none; outline: none; background: transparent; color: var(--text); padding: 10px 8px; line-height: 1.5; }
    textarea::placeholder { color: var(--muted); }
    .send-btn, .attach-btn { width: 42px; height: 42px; border: none; border-radius: 13px; cursor: pointer; background: var(--button); color: var(--text); font-size: 18px; }
    .send-btn { background: linear-gradient(135deg, #7c5cff, #4d9eff); color: white; }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
    .mobile-menu { display: none; }
    @media(max-width:750px) { .sidebar { transform: translateX(-100%); transition: .25s; } .sidebar.open { transform: translateX(0); } .main { margin-left: 0; } .mobile-menu { display: inline-block; } .composer-area { left: 0; padding: 12px 10px; } .chat-container { width: 94%; padding-top: 30px; } .suggestions { grid-template-columns: 1fr; } .welcome { padding-top: 4vh; } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <div class="logo">✦</div>
      <h2>Nova AI</h2>
    </div>
    <button class="new-chat" onclick="newChat()">＋ New chat</button>
    <div class="history-title">Recent chats</div>
    <div class="history" id="history"></div>
    <div class="sidebar-bottom">
      <button onclick="toggleTheme()" id="themeButton">🌙 Dark mode</button>
      <button>⚙ Settings</button>
      <button>♡ Help & Feedback</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="model">
        <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
        Nova AI
        <span class="badge">Smart</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleTheme()" id="themeIcon" title="Toggle theme">🌙</button>
        <button class="icon-btn">↗</button>
        <button class="icon-btn">•••</button>
      </div>
    </header>
    <section class="chat" id="chat">
      <div class="chat-container" id="messages">
        <div class="welcome" id="welcome">
          <div class="orb">✦</div>
          <h1>How can I help you <span class="gradient">today?</span></h1>
          <p>Ask questions, brainstorm ideas, write code, learn new things, or build something amazing.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="useSuggestion('Create a modern portfolio website')">
              <strong>✦ Create something</strong>
              <span>Build a beautiful portfolio website</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Explain artificial intelligence simply')">
              <strong>◎ Learn something</strong>
              <span>Understand a complex topic easily</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Give me 10 startup ideas')">
              <strong>◈ Brainstorm</strong>
              <span>Generate creative project ideas</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Write a JavaScript function to sort an array')">
              <strong>⌘ Code</strong>
              <span>Get help with programming</span>
            </button>
          </div>
        </div>
      </div>
    </section>
    <div class="composer-area">
      <form class="composer" id="chatForm">
        <div class="input-box">
          <button type="button" class="attach-btn">＋</button>
          <textarea id="input" rows="1" placeholder="Message Nova AI..."></textarea>
          <button type="submit" class="send-btn" id="sendBtn" disabled>↑</button>
        </div>
        <div class="hint">Nova AI can make mistakes. Check important information.</div>
      </form>
    </div>
  </main>
  <script>
    const API_URL = "https://strawberry-ai.onrender.com/chat";
    let conversation = [];
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const messages = document.getElementById("messages");
    const chat = document.getElementById("chat");
    const history = document.getElementById("history");
    const sidebar = document.getElementById("sidebar");
    const themeButton = document.getElementById("themeButton");
    const themeIcon = document.getElementById("themeIcon");

    function toggleTheme() {
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      themeButton.innerHTML = isLight ? "☀️ Light mode" : "🌙 Dark mode";
      themeIcon.innerHTML = isLight ? "☀️" : "🌙";
      localStorage.setItem("novaTheme", isLight ? "light" : "dark");
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem("novaTheme");
      if (savedTheme === "light") {
        document.body.classList.add("light");
        themeButton.innerHTML = "☀️ Light mode";
        themeIcon.innerHTML = "☀️";
      }
    }
    loadTheme();

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
      sendBtn.disabled = !input.value.trim();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("chatForm").requestSubmit();
      }
    });

    function useSuggestion(text) {
      input.value = text;
      input.dispatchEvent(new Event("input"));
      input.focus();
    }

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = type === "user" ? "message user-message" : "message";
      const avatar = document.createElement("div");
      avatar.className = type === "user" ? "avatar user-avatar" : "avatar ai-avatar";
      avatar.textContent = type === "user" ? "Y" : "✦";
      const bubble = document.createElement("div");
      bubble.className = type === "user" ? "bubble user-bubble" : "bubble";
      bubble.textContent = text;
      message.appendChild(avatar);
      message.appendChild(bubble);
      messages.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const message = document.createElement("div");
      message.className = "message";
      message.id = "typingMessage";
      message.innerHTML = '<div class="avatar ai-avatar">✦</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      messages.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function addHistory(text) {
      const item = document.createElement("button");
      item.textContent = text;
      item.onclick = () => { input.value = text; input.dispatchEvent(new Event("input")); input.focus(); };
      history.prepend(item);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();
      addMessage(text, "user");
      conversation.push({ role: "user", content: text });
      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;
      addHistory(text);
      showTyping();
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversation })
        });
        const data = await response.json();
        const typing = document.getElementById("typingMessage");
        if (typing) typing.remove();
        if (!response.ok) throw new Error(data.error || "Server request failed");
        const answer = data.reply;
        addMessage(answer, "ai");
        conversation.push({ role: "assistant", content: answer });
      } catch (error) {
        const typing = document.getElementById("typingMessage");
        if (typing) typing.remove();
        addMessage("Error: " + error.message, "ai");
        console.error(error);
      }
    }

    document.getElementById("chatForm").addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage();
    });

    function newChat() {
      conversation = [];
      location.reload();
    }

    function toggleSidebar() {
      sidebar.classList.toggle("open");
    }
  </script>
</body>
</html>
